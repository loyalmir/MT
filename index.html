<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>우리 MT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDF2EB;
    --ink:#1A231F;
    --pine:#16453E;
    --pine-deep:#0E332D;
    --amber:#F2A93B;
    --amber-deep:#D6871B;
    --muted:#6E7D73;
    --card:#FCFDFB;
    --line:#DCE4DB;
    --check:#1F8A6E;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Gothic A1',sans-serif;
    font-weight:500;
    line-height:1.5;
    padding:0 0 60px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px;margin:0 auto;padding:0 16px;}

  /* ---------- HERO ---------- */
  .hero{
    background:linear-gradient(160deg,var(--pine) 0%,var(--pine-deep) 100%);
    border-radius:0 0 28px 28px;
    padding:26px 22px 30px;
    color:#EAF2EC;
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;
    background:radial-gradient(circle,rgba(242,169,59,.28),transparent 70%);
  }
  .hero .eyebrow{
    font-size:12px;letter-spacing:3px;font-weight:700;
    color:var(--amber);text-transform:uppercase;margin-bottom:6px;
  }
  #syncBadge{letter-spacing:.3px;font-size:10px;font-weight:600;color:rgba(234,242,236,.55);text-transform:none;}
  .title-input{
    font-family:'Black Han Sans',sans-serif;
    font-size:38px;line-height:1.05;letter-spacing:-.5px;
    background:transparent;border:none;color:#fff;width:100%;
    padding:0;margin:0 0 14px;outline:none;
  }
  .title-input::placeholder{color:rgba(255,255,255,.35);}

  .meta{display:flex;flex-direction:column;gap:10px;position:relative;z-index:1;}
  .meta-row{display:flex;align-items:center;gap:10px;}
  .meta-ic{
    width:30px;height:30px;flex:0 0 30px;border-radius:9px;
    background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:15px;
  }
  .meta input{
    flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
    border-radius:10px;padding:9px 12px;color:#fff;font-family:inherit;
    font-size:15px;font-weight:600;outline:none;min-width:0;
  }
  .meta input::placeholder{color:rgba(255,255,255,.4);}
  .meta input[type=date]{color-scheme:dark;}
  .date-sep{color:rgba(255,255,255,.5);font-weight:700;}

  /* ---------- COUNTDOWN ---------- */
  .dday{
    margin:-18px auto 0;position:relative;z-index:3;width:fit-content;
    background:var(--amber);color:var(--pine-deep);
    border-radius:16px;padding:8px 20px 10px;
    box-shadow:0 8px 20px -8px rgba(214,135,27,.7);
    display:flex;align-items:baseline;gap:8px;
  }
  .dday .num{font-family:'Black Han Sans',sans-serif;font-size:30px;line-height:1;}
  .dday .lbl{font-size:12px;font-weight:800;letter-spacing:.5px;padding-bottom:2px;}

  /* ---------- SECTION ---------- */
  section{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:18px 16px;margin-top:18px;
  }
  .sec-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .sec-no{
    font-family:'Black Han Sans',sans-serif;font-size:15px;
    color:#fff;background:var(--pine);width:26px;height:26px;border-radius:8px;
    display:grid;place-items:center;flex:0 0 26px;
  }
  .sec-title{font-size:17px;font-weight:800;}
  .sec-sub{font-size:12px;color:var(--muted);font-weight:600;margin-left:auto;}

  /* ---------- TIME ---------- */
  .time-row{display:flex;align-items:flex-end;gap:8px;margin-bottom:16px;}
  .time-field{flex:1 1 0;min-width:0;}
  .time-field label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px;letter-spacing:.5px;}
  .time-field input{
    width:100%;min-width:0;height:46px;background:#F1F5F0;border:1px solid var(--line);border-radius:11px;
    padding:0 4px;font-family:'Gothic A1';font-size:12px;font-weight:700;color:var(--pine-deep);
    outline:none;text-align:center;box-sizing:border-box;
  }
  /* iOS/아이패드 native 타임픽커 값 가운데 정렬 (박스 밖으로 나가는 것 방지) */
  .time-field input::-webkit-date-and-time-value{text-align:center;margin:0;}
  .time-arrow{flex:0 0 auto;height:46px;display:flex;align-items:center;
    color:var(--amber-deep);font-weight:900;font-size:15px;}
  /* 여행 전체(날짜+시간) 시간표 */
  .timeline{margin-top:2px;}
  .tl-days{display:flex;gap:5px;}
  .tl-day{flex:1;min-width:0;}
  .tl-bar{position:relative;height:12px;border-radius:6px;background:#E4EAE2;overflow:hidden;}
  .tl-bar .seg{position:absolute;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,var(--amber),var(--amber-deep));}
  .tl-label{margin-top:7px;text-align:center;font-size:11px;color:var(--muted);font-weight:700;}
  .tl-empty{text-align:center;font-size:12px;color:var(--muted);font-weight:600;padding:8px 0;}

  /* ---------- CHECKLIST ---------- */
  .progress-wrap{margin-bottom:14px;}
  .progress-bar{height:8px;background:#E4EAE2;border-radius:6px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--check);border-radius:6px;transition:width .3s;width:0;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;}
  .chip{
    border:1px dashed var(--line);background:#F4F8F3;color:var(--pine);
    border-radius:20px;padding:6px 12px;font-size:13px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:.15s;
  }
  .chip:hover{background:var(--pine);color:#fff;border-color:var(--pine);}
  .chip:disabled{opacity:.3;cursor:default;}
  .chip::before{content:"+ ";}

  /* 담은 준비물 (눌러서 체크) */
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .tag{display:inline-flex;align-items:center;gap:7px;border-radius:20px;padding:8px 10px 8px 13px;
    background:var(--pine);color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;}
  .tag.done{background:#E4EAE2;color:var(--muted);}
  .tag.done .tag-label{text-decoration:line-through;}
  .tag-label{line-height:1;}
  .tag-x{font-size:16px;line-height:1;opacity:.65;font-weight:400;padding:0 1px;}
  .tag-x:hover{opacity:1;}

  .add-row{display:flex;gap:8px;margin-bottom:14px;}
  .add-row input{
    flex:1;background:#F1F5F0;border:1px solid var(--line);border-radius:11px;
    padding:11px 13px;font-family:inherit;font-size:15px;font-weight:600;outline:none;min-width:0;
  }
  .add-row input:focus{border-color:var(--pine);}
  .add-btn{
    background:var(--pine);color:#fff;border:none;border-radius:11px;
    padding:0 18px;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;
  }
  .list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .item{
    display:flex;align-items:center;gap:11px;
    background:#F6FAF5;border:1px solid var(--line);border-radius:12px;padding:11px 12px;
  }
  .item.done{background:#EFF6EE;}
  .box{
    width:23px;height:23px;flex:0 0 23px;border-radius:7px;border:2px solid #C3D0C1;
    display:grid;place-items:center;cursor:pointer;transition:.15s;background:#fff;
  }
  .box.on{background:var(--check);border-color:var(--check);}
  .box svg{width:13px;height:13px;stroke:#fff;stroke-width:3.5;fill:none;opacity:0;}
  .box.on svg{opacity:1;}
  .item .name{flex:1;font-size:15px;font-weight:600;}
  .item.done .name{text-decoration:line-through;color:var(--muted);}
  .del{
    background:none;border:none;color:#C3CDC2;font-size:20px;cursor:pointer;
    padding:0 2px;line-height:1;font-weight:400;
  }
  .del:hover{color:#D9534F;}
  .empty{text-align:center;color:var(--muted);font-size:13px;font-weight:600;padding:18px 0;}

  /* ---------- 개인 준비물 ---------- */
  .person{border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px;background:#F8FBF7;}
  .person-head{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;}
  .avatar{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:var(--pine);color:#fff;
    display:grid;place-items:center;font-weight:800;font-size:14px;}
  .person-name{font-size:16px;font-weight:800;}
  .person-prog{margin-left:auto;font-size:12px;font-weight:800;color:var(--check);}
  .person-del{background:none;border:none;color:#C3CDC2;font-size:20px;cursor:pointer;padding:0 2px;line-height:1;}
  .person-del:hover{color:#D9534F;}
  .chev{flex:0 0 auto;color:var(--muted);font-size:12px;transition:transform .2s;}
  .person.open .chev{transform:rotate(180deg);}
  .person-body{display:none;margin-top:12px;}
  .person.open .person-body{display:block;}
  .person .list{margin-bottom:0;}
  .person .item{background:#fff;}
  .person .item.done{background:#EFF6EE;}
  .person .add-row{margin:10px 0 0;}
  .person .add-row input{background:#fff;}
  .person-empty{text-align:center;font-size:12px;color:var(--muted);font-weight:600;padding:8px 0;}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="eyebrow">MT PLAN <span id="syncBadge"></span></div>
    <input class="title-input" id="tripName" placeholder="우리 MT" maxlength="18">
    <div class="meta">
      <div class="meta-row">
        <div class="meta-ic">📍</div>
        <input id="place" placeholder="펜션 이름 / 장소">
      </div>
      <div class="meta-row">
        <div class="meta-ic">📅</div>
        <input type="date" id="startDate">
        <span class="date-sep">→</span>
        <input type="date" id="endDate">
      </div>
    </div>
  </div>

  <div class="dday" id="dday">
    <span class="num" id="ddayNum">D-?</span>
    <span class="lbl">출발까지</span>
  </div>

  <!-- 생활 시간 -->
  <section>
    <div class="sec-head">
      <div class="sec-no">1</div>
      <div class="sec-title">생활 시간</div>
      <div class="sec-sub" id="timeSummary"></div>
    </div>
    <div class="time-row">
      <div class="time-field">
        <label>시작</label>
        <input type="time" id="startTime" value="14:00">
      </div>
      <div class="time-arrow">→</div>
      <div class="time-field">
        <label>종료</label>
        <input type="time" id="endTime" value="02:00">
      </div>
    </div>
    <div class="timeline" id="timeline"></div>
  </section>

  <!-- 공동 준비물 -->
  <section>
    <div class="sec-head">
      <div class="sec-no">2</div>
      <div class="sec-title">공동 준비물</div>
      <div class="sec-sub" id="checkSummary">0 / 0</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
    </div>
    <div class="add-row">
      <input id="itemInput" placeholder="공동 준비물 입력 (예: 고기, 숯, 스피커)" maxlength="24">
      <button class="add-btn" id="addBtn">추가</button>
    </div>
    <div class="tags" id="tags"></div>
    <div class="empty" id="empty">직접 추가하면 여기 담기고, 담은 걸 누르면 체크돼 ✅</div>
  </section>

  <!-- 개인 준비물 -->
  <section>
    <div class="sec-head">
      <div class="sec-no">3</div>
      <div class="sec-title">개인 준비물</div>
      <div class="sec-sub" id="peopleSummary"></div>
    </div>
    <div class="add-row">
      <input id="personInput" placeholder="참가자 이름 추가" maxlength="10">
      <button class="add-btn" id="personBtn">추가</button>
    </div>
    <div id="people"></div>
    <div class="person-empty" id="peopleEmpty">참가자를 추가하면 기본 준비물이 세팅되고, 각자 챙긴 걸 체크할 수 있어 🧍</div>
  </section>

</div>

<script>
(function(){
  "use strict";
  const KEY = "mt-planner-v1";

  /* =========================================================
     실시간 공유 설정 (Firebase 실시간 DB)
     아래 값을 채우면 모든 참가자가 같은 화면을 실시간으로 공유해.
     비워두면 이 기기에만 저장(localStorage)돼.
       1) console.firebase.google.com 에서 프로젝트 생성
       2) 웹앱(</>) 추가 → config 값 복사해서 아래에 붙여넣기 (databaseURL 필수)
       3) 빌드 > Realtime Database 생성
       4) 규칙(Rules)을 { "rules": { ".read": true, ".write": true } } 로
     ========================================================= */
  const firebaseConfig = {
    apiKey: "",
    authDomain: "mtgo-dba8f.firebaseapp.com",
    databaseURL: "https://mtgo-dba8f-default-rtdb.firebaseio.com",
    projectId: "mtgo-dba8f",
    appId: ""
  };
  const ROOM = "main";                       // 모두가 함께 쓰는 방
  const SYNC_ON = !!firebaseConfig.databaseURL;

  // ---- 저장소 (localStorage, 미지원시 메모리 폴백) ----
  let mem = {};
  const store = {
    get(){ try{ return localStorage.getItem(KEY); }catch(e){ return mem[KEY]||null; } },
    set(v){ try{ localStorage.setItem(KEY,v); }catch(e){ mem[KEY]=v; } }
  };

  const PERSONAL = ["칫솔·치약","속옷·양말","세면도구","충전기","개인 상비약","편한 옷·잠옷"];
  const uid = () => Math.random().toString(36).slice(2,8);

  const defaults = {
    name:"", place:"", startDate:"", endDate:"",
    startTime:"15:00", endTime:"11:00", items:[], people:[]
  };
  let state = Object.assign({}, defaults);
  try{ const raw=store.get(); if(raw) state=Object.assign({}, defaults, JSON.parse(raw)); }catch(e){}

  const $ = id => document.getElementById(id);
  let applyingRemote=false, pushRemote=()=>{};
  function save(){ store.set(JSON.stringify(state)); if(!applyingRemote) pushRemote(); }

  // ---- 헤더 바인딩 ----
  const bind = (id, key, after) => {
    const el = $(id); el.value = state[key] || el.value;
    if(!state[key]) state[key] = el.value;
    el.addEventListener("input", ()=>{ state[key]=el.value; save(); if(after) after(); });
  };
  bind("tripName","name");
  bind("place","place");
  bind("startDate","startDate", ()=>{ renderDday(); renderTimeline(); });
  bind("endDate","endDate", renderTimeline);
  bind("startTime","startTime", renderTimeline);
  bind("endTime","endTime", renderTimeline);

  // ---- D-day ----
  function renderDday(){
    const box=$("dday"), num=$("ddayNum"), lbl=box.querySelector(".lbl");
    if(!state.startDate){ num.textContent="D-?"; lbl.textContent="날짜를 정해줘"; return; }
    const today=new Date(); today.setHours(0,0,0,0);
    const d=new Date(state.startDate+"T00:00:00");
    const diff=Math.round((d-today)/86400000);
    if(diff>0){ num.textContent="D-"+diff; lbl.textContent="출발까지"; }
    else if(diff===0){ num.textContent="D-DAY"; lbl.textContent="오늘 출발! 🚗"; }
    else { num.textContent="D+"+(-diff); lbl.textContent="추억 완료 ✨"; }
  }

  // ---- 여행 시간표 (날짜 + 시간 연동) ----
  const WD=["일","월","화","수","목","금","토"];
  function toMin(t){ const [h,m]=t.split(":").map(Number); return h*60+m; }
  function dateList(){
    if(!state.startDate) return [];
    const end=state.endDate||state.startDate;
    const s=new Date(state.startDate+"T00:00:00"), e=new Date(end+"T00:00:00");
    if(e<s) return [new Date(s)];
    const arr=[]; for(let d=new Date(s); d<=e; d.setDate(d.getDate()+1)) arr.push(new Date(d));
    return arr;
  }
  function renderTimeline(){
    const el=$("timeline"), sum=$("timeSummary"), days=dateList();
    if(!days.length){ el.innerHTML='<div class="tl-empty">위에 날짜를 정하면 여행 시간표가 그려져</div>'; sum.textContent=""; return; }
    const sMin=toMin(state.startTime), eMin=toMin(state.endTime);
    let html='<div class="tl-days">';
    days.forEach((d,i)=>{
      let from = i===0 ? sMin : 0;
      let to   = i===days.length-1 ? eMin : 1440;
      if(days.length===1){ from=sMin; to=(eMin>sMin?eMin:1440); }
      const left=Math.max(0,from)/1440*100, width=Math.max(0,to-from)/1440*100;
      html+='<div class="tl-day"><div class="tl-bar">'+
            (width>0?'<div class="seg" style="left:'+left+'%;width:'+width+'%"></div>':'')+
            '</div><div class="tl-label">'+(d.getMonth()+1)+'/'+d.getDate()+' ('+WD[d.getDay()]+')</div></div>';
    });
    html+='</div>'; el.innerHTML=html;
    const nights=days.length-1;
    const startDT=new Date(state.startDate+"T"+state.startTime);
    const endDT=new Date((state.endDate||state.startDate)+"T"+state.endTime);
    const hours=Math.round((endDT-startDT)/3600000);
    const span = nights>0 ? (nights+"박 "+days.length+"일") : "당일";
    sum.textContent = span + (hours>0 ? " · 총 "+hours+"시간" : "");
  }

  // ---- 공동 준비물 ----
  const empty=$("empty");
  function renderTags(){
    const box=$("tags"); box.innerHTML="";
    empty.style.display = state.items.length ? "none":"block";
    state.items.forEach((it,idx)=>{
      const tag=document.createElement("div");
      tag.className="tag"+(it.done?" done":"");
      tag.innerHTML='<span class="tag-label"></span><span class="tag-x" aria-label="삭제">×</span>';
      tag.querySelector(".tag-label").textContent=it.name;
      tag.querySelector(".tag-label").onclick=()=>{ it.done=!it.done; save(); renderTags(); renderProgress(); };
      tag.querySelector(".tag-x").onclick=(e)=>{ e.stopPropagation(); state.items.splice(idx,1); save(); renderAll(); };
      box.appendChild(tag);
    });
  }
  function renderProgress(){
    const total=state.items.length;
    const done=state.items.filter(i=>i.done).length;
    $("checkSummary").textContent=done+" / "+total;
    $("progFill").style.width=(total? (done/total*100):0)+"%";
  }
  function addItem(name){
    name=(name||"").trim(); if(!name) return;
    if(state.items.some(i=>i.name===name)) return;
    state.items.push({name,done:false}); save(); renderAll();
  }
  $("addBtn").onclick=()=>{ addItem($("itemInput").value); $("itemInput").value=""; $("itemInput").focus(); };
  $("itemInput").addEventListener("keydown",e=>{ if(e.key==="Enter"){ addItem(e.target.value); e.target.value=""; }});

  // ---- 개인 준비물 ----
  const openPeople = new Set();
  function renderPeople(){
    const wrap=$("people"); wrap.innerHTML="";
    $("peopleEmpty").style.display = state.people.length ? "none":"block";
    $("peopleSummary").textContent = state.people.length ? state.people.length+"명" : "";
    state.people.forEach(p=>{
      const t=p.items.length, d=p.items.filter(i=>i.done).length;
      const card=document.createElement("div");
      card.className="person"+(openPeople.has(p.id)?" open":"");
      card.innerHTML=
        '<div class="person-head">'+
          '<div class="avatar"></div>'+
          '<div class="person-name"></div>'+
          '<div class="person-prog">'+d+' / '+t+'</div>'+
          '<button class="person-del" aria-label="참가자 삭제">×</button>'+
          '<span class="chev">▾</span>'+
        '</div>'+
        '<div class="person-body">'+
          '<ul class="list"></ul>'+
          '<div class="add-row">'+
            '<input class="p-input" placeholder="준비물 추가" maxlength="20">'+
            '<button class="add-btn p-add">추가</button>'+
          '</div>'+
        '</div>';
      card.querySelector(".avatar").textContent = p.name.slice(0,1);
      card.querySelector(".person-name").textContent = p.name;
      card.querySelector(".person-head").onclick=(e)=>{
        if(e.target.closest(".person-del")) return;
        if(openPeople.has(p.id)) openPeople.delete(p.id); else openPeople.add(p.id);
        card.classList.toggle("open");
      };
      card.querySelector(".person-del").onclick=(e)=>{
        e.stopPropagation();
        if(!confirm(p.name+" 님을 삭제할까요? 준비물 목록도 같이 지워져요.")) return;
        openPeople.delete(p.id);
        state.people=state.people.filter(x=>x.id!==p.id); save(); renderPeople();
      };
      const ul=card.querySelector(".list");
      p.items.forEach((it,idx)=>{
        const li=document.createElement("li");
        li.className="item"+(it.done?" done":"");
        li.innerHTML='<div class="box'+(it.done?" on":"")+'"><svg viewBox="0 0 24 24"><polyline points="4,12 10,18 20,6"/></svg></div>'+
          '<span class="name"></span><button class="del" aria-label="삭제">×</button>';
        li.querySelector(".name").textContent=it.name;
        li.querySelector(".box").onclick=()=>{ it.done=!it.done; save(); renderPeople(); };
        li.querySelector(".del").onclick=()=>{ p.items.splice(idx,1); save(); renderPeople(); };
        ul.appendChild(li);
      });
      const inp=card.querySelector(".p-input");
      const addP=()=>{ const v=inp.value.trim(); if(v && !p.items.some(i=>i.name===v)){ p.items.push({name:v,done:false}); save(); renderPeople(); } };
      card.querySelector(".p-add").onclick=addP;
      inp.addEventListener("keydown",e=>{ if(e.key==="Enter") addP(); });
      wrap.appendChild(card);
    });
  }
  function addPerson(name){
    name=(name||"").trim(); if(!name) return;
    state.people.push({id:uid(), name:name, items:PERSONAL.map(n=>({name:n,done:false}))});
    save(); renderPeople();
  }
  $("personBtn").onclick=()=>{ addPerson($("personInput").value); $("personInput").value=""; $("personInput").focus(); };
  $("personInput").addEventListener("keydown",e=>{ if(e.key==="Enter"){ addPerson(e.target.value); e.target.value=""; }});

  function renderAll(){ renderTags(); renderProgress(); renderPeople(); }

  // ---- 헤더 입력값 반영 (입력 중인 칸은 건드리지 않음) ----
  const HEADER=[["tripName","name"],["place","place"],["startDate","startDate"],["endDate","endDate"],["startTime","startTime"],["endTime","endTime"]];
  function syncInputs(){
    HEADER.forEach(([id,key])=>{ const el=$(id); if(el && document.activeElement!==el) el.value = state[key]||""; });
  }
  function renderAllFull(){ syncInputs(); renderDday(); renderTimeline(); renderAll(); }

  // ---- 초기 렌더 ----
  renderAllFull();

  // ---- 실시간 공유 (Firebase 실시간 DB) ----
  function setBadge(t){ const b=$("syncBadge"); if(b) b.textContent=t; }
  setBadge(SYNC_ON ? "· 공유 연결 중…" : "· 이 기기에 저장");
  (async function initSync(){
    if(!SYNC_ON) return;
    try{
      const [{ initializeApp }, { getDatabase, ref, onValue, set:fbSet }] = await Promise.all([
        import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"),
        import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js")
      ]);
      const db = getDatabase(initializeApp(firebaseConfig));
      const dbRef = ref(db, "rooms/"+ROOM);
      let timer=null;
      pushRemote = ()=>{ clearTimeout(timer); timer=setTimeout(()=>{ fbSet(dbRef, state).catch(()=>{}); }, 250); };
      let first=true;
      onValue(dbRef, (snap)=>{
        const val=snap.val();
        if(!val){ if(first){ first=false; pushRemote(); } return; }  // 방이 비어있으면 내 데이터로 초기화
        first=false;
        applyingRemote=true;
        state=Object.assign({}, defaults, val);
        if(!Array.isArray(state.items)) state.items=[];
        if(!Array.isArray(state.people)) state.people=[];
        store.set(JSON.stringify(state));
        renderAllFull();
        applyingRemote=false;
      });
      setBadge("· 실시간 공유 중");
    }catch(e){ setBadge("· 이 기기에 저장 (공유 연결 실패)"); }
  })();
})();
</script>
</body>
